name: kabakaba_vendeur
description: "kabakaba — Application vendeur pour les cantines universitaires"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # La configuration (URL d'API, environnement) passe par --dart-define, pas
  # par un .env embarqué : un asset est extractible de l'APK et ne permet
  # aucune séparation dev / staging / prod. Voir lib/core/config/app_config.dart.
  assets:
    - assets/images/
    - assets/icons/
